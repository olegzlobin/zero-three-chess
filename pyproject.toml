[project]
name = "zero-three-chess"
version = "0.1.0"
description = "Experimental chess engine(s) and tools built on top of python-chess."
requires-python = ">=3.10"
authors = [
  { name = "Oleg Zlobin" }
]
dependencies = [
  "chess>=1.11.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
dev = [
  "pytest",
  "mypy",
]

